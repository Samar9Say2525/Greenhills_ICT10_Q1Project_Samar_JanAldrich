<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="SKU.css">
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
    <div class="container-fluid">
        <div class="collapse navbar-collapse" id="mynavbar">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Samarium</a></li>
          </ul>
          <form class="d-flex">
          <ul class="navbar-nav me-auto">
                <li><a class="nav-link" href="index.html">Receipt Generator</a></li>
                <li><a class="nav-link" href="SKU.html">SKU generator</a></li>
            </ul>
          </form>
        </div>
      </div>  
</nav>

<div id="selection"><br>
    <div class="container-fluid pt-4" id="title"> 
        <div class="col-md-12">
            <h1>Samarium's SKU generator</h1><br>
        </div>
    </div>

    <div class="container pt-4 mt-4 pb-4" id="generator">
        <div class="col-md-12">
            <div class="mt-3 p-3">
                <div class="container row pb-4">
                <h4>SKU Generator</h4>
                <form>
                <div class="col-md-12">
                    <label for="ctgy">Catgory</label>
                        <select name="ctgy"  class="form-control" id="ctgy">
                            <option value="1P">Perishables</option>
                            <option value="2NP">Non-Perishables</option>
                        </select>  
                </div>

                
                <div class="col-md-12 mt-2">
                    <div class="form-group">
                    <label for="ctgy">Product Name</label>
                    <input type="name" class="form-control" id="name" placeholder="e.g. Bottled Water">      
                    </div>             
                </div>

                <div class="col-md-12 mt-2">
                    <div class="form-group">
                    <label for="qnty">Quantity</label>
                    <input type="number" class="form-control" id="qnty" placeholder="e.g. 50"><br>     
                    </div>             
                </div>
               
                <input class="container fluid"type="button" class="button" value="Submit" py-click="generate"><br>
                </form>
            </div> 
                <h3>Generated SKU:</h3>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <py-script src="SKU.py"></py-script>
</body>
</html>
